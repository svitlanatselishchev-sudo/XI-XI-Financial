name: Move workshops catalog
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: svitlanatselishchev-sudo/xixi-workshop
          path: old-catalog
      - name: Copy workshop pages and rewrite URLs
        run: |
          cp -r old-catalog/w workshops/w
          cp -r old-catalog/en/w workshops/en/w
          find workshops -name '*.html' -type f -exec sed -i 's|https://svitlanatselishchev-sudo.github.io/xixi-workshop/|https://xixistrategy.com/workshops/|g' {} +
          for f in index.html services.html story.html insights.html intake.html access.html 5-invisible-ledger-errors.html florida-sales-tax-pre-audit-checklist.html intercompany-balances-reconcile-to-zero.html; do sed -i 's|https://svitlanatselishchev-sudo.github.io/xixi-workshop/en/|https://xixistrategy.com/workshops/en/|g' "$f"; done
          git config user.name "svitlanatselishchev-sudo"
          git config user.email "svitlanatselishchev-sudo@users.noreply.github.com"
          git add workshops index.html services.html story.html insights.html intake.html access.html 5-invisible-ledger-errors.html florida-sales-tax-pre-audit-checklist.html intercompany-balances-reconcile-to-zero.html
          git status --short
          git commit -m "Move workshop pages to workshops/ and point menu links to xixistrategy.com" || echo "nothing to commit"
          git push
