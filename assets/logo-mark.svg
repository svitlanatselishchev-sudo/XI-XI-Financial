<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 32" role="img" aria-labelledby="title desc">
  <title id="title">XI:XI mark</title>
  <desc id="desc">Modern XI:XI signature mark representing four aligned pillars and the 11:11 midpoint colon.</desc>
  <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
    <!-- Left Pillar Pair (11) -->
    <path d="M7 5v22M14 5v22"/>
    <!-- Right Pillar Pair (11) -->
    <path d="M26 5v22M33 5v22"/>
  </g>
  <!-- Central Colon (:) -->
  <circle cx="20" cy="11" r="1.75" fill="currentColor"/>
  <circle cx="20" cy="21" r="1.75" fill="currentColor"/>
</svg>
